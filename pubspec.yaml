name: glories_music
description: "GLORIES Music — a Flutter/Cupertino recreation of the GLORIES Music iOS 14 design."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # Glyph font for `CupertinoIcons`; the app itself has no other runtime dependency.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Needed only for Icons.airplay / Icons.apple, the two Material glyphs the
  # Cupertino set does not have.
  uses-material-design: true
  assets:
    - assets/images/
